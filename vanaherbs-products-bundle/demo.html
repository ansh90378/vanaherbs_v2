<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Scroller Demo — VanaHerbs</title>
<link rel="stylesheet" href="product-scroller.css" />
<style>
  body {
    margin: 0;
    background: #0c1410;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #f4efe4;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; }
  .wrap-title { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #c9a227; }
</style>
</head>
<body>
  <div class="container product-scroller-section">
    <p class="wrap-title">— What We Supply</p>
    <h1>Our botanical collection</h1>
    <div class="product-scroller-wrap">
      <div id="product-scroller" class="product-scroller"></div>
    </div>
  </div>

  <script src="product-scroller.js" defer></script>
</body>
</html>
